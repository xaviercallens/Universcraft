[package]
name = "holo_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.14", default-features = false, features = ["bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_winit", "x11", "tonemapping_luts"], optional = true }
fast-surface-nets = { path = "../repos/fast-surface-nets-rs", optional = true }
burn = { version = "0.14.0", optional = true }
salva3d = { path = "../repos/salva/build/salva3d", optional = true }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rayon = "1.10"

[features]
default = []
full = ["dep:bevy", "dep:fast-surface-nets", "dep:burn", "dep:salva3d"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "perf_benchmarks"
harness = false
