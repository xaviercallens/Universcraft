<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloEngine - Galerie des Scènes WGSL (Miniatures)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #58a6ff;
            margin-top: 20px;
        }
        p {
            margin-bottom: 30px;
            color: #8b949e;
        }
        .gallery-container {
            width: 95%;
            max-width: 1920px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background: #000;
        }
        .gallery-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-back {
            margin-top: 30px;
            margin-bottom: 30px;
            padding: 10px 20px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-back:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <h1>Galerie des Moteurs Cinématiques</h1>
    <p>Rendu natif GPU T4 (WGSL) - Aperçu global 4x5 de toutes les scènes optimisées</p>
    
    <div class="gallery-container">
        <img src="/output/gallery_4x5.png" alt="Galerie 4x5 des scènes">
    </div>

    <a href="/" class="btn-back">Retour au Visualiseur Interactif</a>
</body>
</html>
