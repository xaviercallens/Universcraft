<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloEngine — Live Offline WebGPU Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #sidebar {
            width: 340px;
            background: #161b22;
            border-left: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
            z-index: 10;
        }
        h2 { font-size: 1.2rem; color: #58a6ff; }
        .badge {
            display: inline-block;
            background: #238636;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        label { font-size: 0.85rem; color: #8b949e; display: block; margin-bottom: 4px; }
        select, input[type="range"] {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .stats-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #7ee787;
        }
        .nav-links {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #30363d; color: #fff; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 18px;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        #overlay h1 { font-size: 1.1rem; color: #58a6ff; }
        #overlay p { font-size: 0.8rem; color: #8b949e; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="overlay">
        <h1 id="scene-title">Kerr Black Hole & Relativistic Spacetime</h1>
        <p>100% Offline Client-Side WebGPU Raymarching | Drag mouse to rotate</p>
    </div>
    <canvas id="webgpu-canvas"></canvas>
</div>

<div id="sidebar">
    <div>
        <h2>HoloEngine WebGPU <span class="badge">OFFLINE</span></h2>
        <p style="font-size: 0.8rem; color: #8b949e; margin-top: 4px;">Zero-Copy GPU In-Browser Shader Execution</p>
    </div>

    <div>
        <label for="scene-select">Physical Biome / Shader</label>
        <select id="scene-select">
            <option value="black_hole">🕳️ Kerr Black Hole (T-Dual Relativistic)</option>
            <option value="magma_planck">🔥 Volcano Magma Core (Planck Blackbody 800K-1500K)</option>
            <option value="ocean_waves">🌊 Ocean Hydrodynamics (Navier-Stokes)</option>
            <option value="desert_dunes">🏜️ Aeolian Desert Dunes (1-Lipschitz)</option>
            <option value="crystal_cave">💎 Crystal Cave (Fresnel SSR & IOR 1.54)</option>
            <option value="atmosphere">☁️ Atmospheric Clouds (Rayleigh-Mie)</option>
        </select>
    </div>

    <div>
        <label for="camera-fov">Field of View (FOV): <span id="fov-val">60°</span></label>
        <input type="range" id="camera-fov" min="30" max="100" value="60">
    </div>

    <div>
        <label for="time-speed">Simulation Speed: <span id="speed-val">1.0x</span></label>
        <input type="range" id="time-speed" min="0" max="300" value="100">
    </div>

    <div class="stats-card">
        <div>GPU Backend: <span id="gpu-name">Detecting...</span></div>
        <div>FPS: <span id="fps-val">--</span> (<span id="frame-time">--</span> ms)</div>
        <div>Resolution: <span id="res-val">--</span></div>
        <div style="margin-top: 8px; border-top: 1px dashed #30363d; padding-top: 6px; color: #58a6ff;">
            TDA Invariant: <span id="tda-status">Active</span>
        </div>
    </div>

    <div class="nav-links">
        <a href="index.html" class="btn">Remote Node</a>
        <a href="gallery.html" class="btn">4x5 Gallery</a>
    </div>
</div>

<script type="module">
    const canvas = document.getElementById('webgpu-canvas');
    const sceneSelect = document.getElementById('scene-select');
    const sceneTitle = document.getElementById('scene-title');
    const fovSlider = document.getElementById('camera-fov');
    const fovVal = document.getElementById('fov-val');
    const speedSlider = document.getElementById('time-speed');
    const speedVal = document.getElementById('speed-val');
    const gpuNameEl = document.getElementById('gpu-name');
    const fpsValEl = document.getElementById('fps-val');
    const frameTimeEl = document.getElementById('frame-time');
    const resValEl = document.getElementById('res-val');

    fovSlider.addEventListener('input', (e) => fovVal.innerText = `${e.target.value}°`);
    speedSlider.addEventListener('input', (e) => speedVal.innerText = `${(e.target.value/100).toFixed(1)}x`);

    // WGSL Shaders
    const wgslShaders = {
        black_hole: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn hash33(p: vec3<f32>) -> vec3<f32> {
                var p3 = fract(p * vec3<f32>(0.1031, 0.1030, 0.0973));
                p3 += dot(p3, p3.yxz + 33.33);
                return fract((p3.xxy + p3.yxx) * p3.zyx);
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                var ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                let r_horizon = 1.0;
                let r_isco = 3.0;
                var col = vec3<f32>(0.0);
                var min_dist = 1000.0;

                for (var i = 0; i < 90; i++) {
                    let r = length(ray_pos);
                    min_dist = min(min_dist, r);
                    if (r < r_horizon) { col = vec3<f32>(0.0); break; }
                    if (r > 35.0) {
                        let star_p = floor(ray_dir * 180.0);
                        let star_h = hash33(star_p);
                        if (star_h.x > 0.985) { col += vec3<f32>(star_h.y * 1.5); }
                        break;
                    }
                    if (abs(ray_pos.y) < 0.18 && r > r_isco && r < 12.0) {
                        let disk_lum = exp(-(r - r_isco) * 0.45) * 1.8;
                        let phi = atan2(ray_pos.z, ray_pos.x) - u.time * (2.5 / sqrt(r));
                        let spiral = sin(phi * 3.0 + r * 1.2) * 0.5 + 0.5;
                        let doppler = clamp(1.0 - ray_dir.x * 0.55, 0.4, 2.2);
                        let fire = vec3<f32>(1.0, 0.55 * doppler, 0.15) * disk_lum * (0.6 + 0.4 * spiral);
                        col += fire * 0.25;
                    }
                    let r_eff = max(r, 0.5 / max(r, 0.01));
                    let g_accel = -1.5 * ray_pos / (r_eff * r_eff * r_eff);
                    ray_dir = normalize(ray_dir + g_accel * 0.16);
                    ray_pos += ray_dir * 0.16;
                }
                return vec4<f32>(col, 1.0);
            }
        `,
        ocean_waves: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn hash21(p: vec2<f32>) -> f32 {
                var p3 = fract(vec3<f32>(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            fn ocean_wave_h(xz: vec2<f32>, t: f32) -> f32 {
                let d1 = vec2<f32>(0.82, 0.57);
                let d2 = vec2<f32>(-0.62, 0.78);
                let d3 = vec2<f32>(0.94, -0.34);
                let d4 = vec2<f32>(0.73, 0.68);
                var h = 0.18 * sin(dot(xz, d1) * 0.38 - 1.93 * t);
                h += 0.09 * sin(dot(xz, d2) * 0.88 - 2.94 * t + 1.4);
                h += 0.04 * sin(dot(xz, d3) * 2.1 - 4.54 * t + 2.8);
                h += 0.015 * sin(dot(xz, d4) * 5.2 - 7.14 * t + 0.9);
                return h;
            }

            fn ocean_norm(xz: vec2<f32>, t: f32) -> vec3<f32> {
                let eps = 0.02;
                let h0 = ocean_wave_h(xz, t);
                let dx = (ocean_wave_h(xz + vec2<f32>(eps, 0.0), t) - h0) / eps;
                let dz = (ocean_wave_h(xz + vec2<f32>(0.0, eps), t) - h0) / eps;
                return normalize(vec3<f32>(-dx, 1.0, -dz));
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                let cam_pos = vec3<f32>(0.0, -3.2, -7.0);

                let sun_underwater = normalize(vec3<f32>(0.35 / 1.3333, 0.89, 0.45 / 1.3333));
                let sun_dir = normalize(vec3<f32>(0.35, 0.82, 0.45));
                let sigma_ext = vec3<f32>(0.392, 0.077, 0.053);
                let sigma_scat = vec3<f32>(0.012, 0.022, 0.038);

                var hit_surface = false;
                var t_hit = 50.0;
                if (ray_dir.y > 0.001) {
                    let t_plane = -cam_pos.y / ray_dir.y;
                    var t_curr = max(t_plane - 1.5, 0.05);
                    for (var i = 0; i < 36; i++) {
                        let p = cam_pos + ray_dir * t_curr;
                        let h = ocean_wave_h(p.xz, u.time);
                        if (p.y >= h) {
                            t_hit = t_curr;
                            hit_surface = true;
                            break;
                        }
                        t_curr += 0.40;
                    }
                }

                var accum = vec3<f32>(0.0);
                var trans = vec3<f32>(1.0);
                let max_march = min(t_hit, 35.0);
                let dt = max_march / 32.0;
                let cos_phase = max(dot(ray_dir, sun_underwater), 0.0);
                let phase_mie = 0.08 / pow(max(1.82 - 1.80 * cos_phase, 0.001), 1.5);
                let sun_corona = pow(cos_phase, 32.0) * 6.0;

                let u_axis = normalize(vec3<f32>(sun_underwater.z, 0.0, -sun_underwater.x));
                let v_axis = cross(sun_underwater, u_axis);

                for (var s = 0; s < 32; s++) {
                    let p = cam_pos + ray_dir * (f32(s) + 0.5) * dt;
                    let h_s = ocean_wave_h(p.xz, u.time);
                    if (p.y > h_s) { break; }
                    let depth = max(h_s - p.y, 0.0);

                    let u_proj = dot(p, u_axis);
                    let v_proj = dot(p, v_axis);
                    let shaft_w1 = sin(u_proj * 1.5 + v_proj * 1.1) * cos(v_proj * 1.7 - u_proj * 0.9);
                    let shaft_w2 = sin(u_proj * 3.6 - v_proj * 3.1) * cos(v_proj * 3.8 + u_proj * 2.3);
                    let shaft = 0.15 + pow(shaft_w1 * 0.5 + 0.5, 4.0) * 5.0 + pow(shaft_w2 * 0.5 + 0.5, 6.0) * 4.0;

                    let sun_trans = exp(-sigma_ext * (depth / 0.89));
                    let shaft_color = mix(vec3<f32>(0.18, 0.88, 0.98), vec3<f32>(1.0, 0.95, 0.82), pow(cos_phase, 12.0));
                    let sun_scatter = shaft_color * (phase_mie * 1.2 + sun_corona * 0.5) * shaft * sun_trans * 16.0;
                    let ambient_scatter = vec3<f32>(0.0005, 0.012, 0.04) * exp(-depth * 0.08);

                    let mote_noise = sin(p.x * 18.0 + sin(p.y * 22.0)) * cos(p.z * 19.0 + p.x * 12.0);
                    var mote = vec3<f32>(0.0);
                    if (mote_noise > 0.86) {
                        mote = vec3<f32>(0.5, 0.9, 1.0) * pow((mote_noise - 0.86) / 0.14, 3.0) * 3.0 * sun_trans.b;
                    }

                    let inscatter = (sun_scatter + ambient_scatter + mote) * sigma_scat;
                    let step_trans = exp(-sigma_ext * dt);
                    accum += trans * inscatter * dt;
                    trans *= step_trans;
                }

                var surface_col = vec3<f32>(0.0005, 0.008, 0.035);
                if (hit_surface) {
                    let p_hit = cam_pos + ray_dir * t_hit;
                    let norm = ocean_norm(p_hit.xz, u.time);
                    let cos_i = clamp(dot(ray_dir, norm), 0.0, 1.0);
                    let sin2_t = 1.7777 * (1.0 - cos_i * cos_i);
                    if (sin2_t <= 1.0) {
                        let cos_t = sqrt(1.0 - sin2_t);
                        let refr = normalize(1.3333 * ray_dir + (1.3333 * cos_i - cos_t) * (-norm));
                        let cos_s = max(dot(refr, sun_dir), 0.0);
                        let sky = mix(vec3<f32>(0.92, 0.65, 0.35), vec3<f32>(0.10, 0.42, 0.85), clamp(refr.y * 1.4, 0.0, 1.0))
                                + vec3<f32>(1.0, 0.90, 0.75) * (pow(cos_s, 32.0) * 4.0 + pow(cos_s, 1024.0) * 20.0);
                        surface_col = mix(sky, surface_col, 0.08);
                    }
                }

                var col = accum + trans * surface_col;
                // ACES Tone Mapping
                col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), vec3<f32>(0.0), vec3<f32>(1.0));
                return vec4<f32>(pow(col, vec3<f32>(1.0 / 2.2)), 1.0);
            }
        `,
        desert_dunes: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            fn hash31(p: vec3<f32>) -> f32 {
                var p3 = fract(p * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }

            fn eval_dune(xz: vec2<f32>) -> vec2<f32> {
                let wind = normalize(vec2<f32>(0.85, 0.52));
                let perp = vec2<f32>(-wind.y, wind.x);
                let u = dot(xz, wind);
                let v = dot(xz, perp);

                // Macro Barchan Crescents
                let crescent_curve = 0.0026 * v * v;
                let u_warped = u - crescent_curve + sin(v * 0.032) * 8.0 + cos(u * 0.014) * 4.0;
                let f_macro = fract(u_warped / 68.0);
                var h_macro = 0.0;
                var is_slip = 0.0;
                if (f_macro < 0.78) {
                    let s = f_macro / 0.78;
                    h_macro = (3.0 * s * s - 2.0 * s * s * s) * 22.0;
                } else {
                    let s = (f_macro - 0.78) / 0.22;
                    h_macro = (1.0 - s) * 22.0;
                    is_slip = 1.0;
                }
                let crest = exp(-pow((f_macro - 0.78) * 35.0, 2.0));

                // Meso Seif Dunes
                let u_meso = (u * 0.7 + v * 0.7) + sin(u * 0.06 + v * 0.04) * 4.0;
                let f_meso = fract(u_meso / 28.0);
                var h_meso = 0.0;
                if (f_meso < 0.75) {
                    let sm = f_meso / 0.75;
                    h_meso = (3.0 * sm * sm - 2.0 * sm * sm * sm) * 5.5;
                } else {
                    h_meso = (1.0 - (f_meso - 0.75) / 0.25) * 5.5;
                }

                // Delicate Stoss Ripples
                let rip_phase = u * 7.5 + sin(v * 0.7) * 0.4;
                let w_rip = fract(rip_phase / 6.2831853);
                let ripple_shape = sin(w_rip * 6.2831853) * 0.018 * (1.0 - is_slip);

                return vec2<f32>(h_macro + h_meso * 0.4 + ripple_shape - 12.0, crest);
            }

            fn eval_norm(xz: vec2<f32>) -> vec3<f32> {
                let eps = 0.04;
                let h0 = eval_dune(xz).x;
                let hx = eval_dune(xz + vec2<f32>(eps, 0.0)).x;
                let hz = eval_dune(xz + vec2<f32>(0.0, eps)).x;
                return normalize(vec3<f32>(-(hx - h0) / eps, 1.0, -(hz - h0) / eps));
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));

                let sun_dir = normalize(vec3<f32>(-0.82, 0.36, 0.45));
                let sun_color = vec3<f32>(3.2, 2.2, 1.1);
                let sand_albedo = vec3<f32>(0.96, 0.65, 0.28);

                let cos_theta = max(ray_dir.y, 0.0);
                let sun_align = max(dot(ray_dir, sun_dir), 0.0);
                let sky_zenith = vec3<f32>(0.025, 0.16, 0.62);
                let sky_mid = vec3<f32>(0.12, 0.42, 0.85);
                let sky_horizon = vec3<f32>(0.92, 0.72, 0.48);

                var sky = mix(sky_mid, sky_zenith, pow(cos_theta, 0.55));
                sky = mix(sky_horizon, sky, smoothstep(0.0, 0.22, cos_theta));
                sky += vec3<f32>(1.0, 0.92, 0.75) * (pow(sun_align, 1024.0) * 24.0 + pow(sun_align, 24.0) * 1.8);

                var p = u.cam_pos;
                var col = sky;
                var hit = false;
                var t = 0.5;

                for (var i = 0; i < 90; i++) {
                    let d_info = eval_dune(p.xz);
                    let dist = (p.y - d_info.x) * 0.72;
                    if (dist < 0.015 * (1.0 + t * 0.02)) {
                        hit = true;
                        let norm = eval_norm(p.xz);
                        let n_dot_l = max(dot(norm, sun_dir), 0.0);
                        
                        // Warm ambient bounce in shadows
                        let bounce_diff = max(dot(norm, normalize(vec3<f32>(-sun_dir.x, 0.6, -sun_dir.z))), 0.0);
                        let warm_bounce = vec3<f32>(0.58, 0.26, 0.10) * bounce_diff * 0.55;
                        let sky_amb = vec3<f32>(0.04, 0.14, 0.38) * (norm.y * 0.5 + 0.5) * 0.35;
                        
                        // SSS on 34° knife edge crests
                        let sss = vec3<f32>(1.0, 0.55, 0.15) * pow(max(-dot(norm, sun_dir) + 0.35, 0.0), 3.0) * d_info.y * 2.5;
                        
                        // High-contrast illumination
                        let surf = sand_albedo * sun_color * n_dot_l + warm_bounce + sky_amb + sss;
                        let fog = 1.0 - exp(-0.0018 * t);
                        col = mix(surf, vec3<f32>(0.75, 0.65, 0.58), fog);
                        break;
                    }
                    p += ray_dir * max(dist, 0.08);
                    t += max(dist, 0.08);
                    if (t > 280.0) { break; }
                }

                // S-Curve & ACES Tone Mapping
                var mapped = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), vec3<f32>(0.0), vec3<f32>(1.0));
                mapped = pow(mapped, vec3<f32>(1.12));
                mapped = smoothstep(vec3<f32>(0.02), vec3<f32>(0.98), mapped);
                return vec4<f32>(pow(mapped, vec3<f32>(1.0 / 2.2)), 1.0);
            }
        `,
        atmosphere: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn hash13(p: vec3<f32>) -> f32 {
                var p3 = fract(p * 0.1031);
                p3 += dot(p3, p3.zyx + 31.32);
                return fract((p3.x + p3.y) * p3.z);
            }

            fn hash33(p: vec3<f32>) -> vec3<f32> {
                var p3 = fract(p * vec3<f32>(0.1031, 0.1030, 0.0973));
                p3 += dot(p3, p3.yxz + 33.33);
                return fract((p3.xxy + p3.yxx) * p3.zyx);
            }

            fn noise3d(p: vec3<f32>) -> f32 {
                let i = floor(p);
                let f = fract(p);
                let u_smooth = f * f * (3.0 - 2.0 * f);
                let n000 = hash13(i + vec3<f32>(0.0, 0.0, 0.0));
                let n100 = hash13(i + vec3<f32>(1.0, 0.0, 0.0));
                let n010 = hash13(i + vec3<f32>(0.0, 1.0, 0.0));
                let n110 = hash13(i + vec3<f32>(1.0, 1.0, 0.0));
                let n001 = hash13(i + vec3<f32>(0.0, 0.0, 1.0));
                let n101 = hash13(i + vec3<f32>(1.0, 0.0, 1.0));
                let n011 = hash13(i + vec3<f32>(0.0, 1.0, 1.0));
                let n111 = hash13(i + vec3<f32>(1.0, 1.0, 1.0));
                let nx00 = mix(n000, n100, u_smooth.x);
                let nx10 = mix(n010, n110, u_smooth.x);
                let nx01 = mix(n001, n101, u_smooth.x);
                let nx11 = mix(n011, n111, u_smooth.x);
                let nxy0 = mix(nx00, nx10, u_smooth.y);
                let nxy1 = mix(nx01, nx11, u_smooth.y);
                return mix(nxy0, nxy1, u_smooth.z);
            }

            fn worley3d(p: vec3<f32>) -> f32 {
                let id = floor(p);
                let fd = fract(p);
                var min_dist = 1.0;
                for (var x = -1; x <= 1; x++) {
                    for (var y = -1; y <= 1; y++) {
                        for (var z = -1; z <= 1; z++) {
                            let neighbor = vec3<f32>(f32(x), f32(y), f32(z));
                            let pt = hash33(id + neighbor);
                            let diff = neighbor + pt - fd;
                            min_dist = min(min_dist, length(diff));
                        }
                    }
                }
                return clamp(1.0 - min_dist, 0.0, 1.0);
            }

            fn henyey_greenstein(cos_th: f32, g: f32) -> f32 {
                let g2 = g * g;
                return (1.0 - g2) / (4.0 * 3.14159265 * pow(max(1.0 + g2 - 2.0 * g * cos_th, 0.001), 1.5));
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                let ray_pos = u.cam_pos + vec3<f32>(0.0, 2.0, 0.0);

                let sun_dir = normalize(vec3<f32>(0.6, 0.5, 0.55));
                let cos_th = dot(ray_dir, sun_dir);
                let phase = mix(henyey_greenstein(cos_th, 0.8), henyey_greenstein(cos_th, -0.2), 0.2);

                let sun_col = vec3<f32>(3.0, 2.6, 2.0);
                let sky_ambient = mix(vec3<f32>(0.4, 0.48, 0.7), vec3<f32>(0.28, 0.32, 0.54), clamp(-ray_dir.y + 0.3, 0.0, 1.0));

                var accum = vec3<f32>(0.0);
                var trans = 1.0;
                let step_dt = 0.35;
                var t = 2.0;

                for (var i = 0; i < 48; i++) {
                    if (t > 40.0 || trans < 0.02) { break; }
                    let p = ray_pos + ray_dir * t;
                    let h_env = smoothstep(0.5, 2.5, p.y) * smoothstep(12.0, 6.0, p.y);
                    let body = clamp(1.8 - length(p * vec3<f32>(0.25, 0.2, 0.25) - vec3<f32>(0.0, 1.0, 0.0)), 0.0, 1.5);
                    let w = worley3d(p * 0.4 + vec3<f32>(u.time * 0.05, 0.0, 0.0));
                    let f = noise3d(p * 1.5);
                    let dens = clamp((body + w * 0.8 - f * 0.35 - 0.4) * h_env * 2.2, 0.0, 1.0);

                    if (dens > 0.005) {
                        let light_p = p + sun_dir * 1.5;
                        let light_dens = clamp((body + worley3d(light_p * 0.4) * 0.8 - 0.4) * h_env * 2.2, 0.0, 1.0);
                        let sun_att = exp(-light_dens * 2.2);
                        let powder = 1.0 - exp(-dens * 2.5);
                        let direct = sun_col * sun_att * phase * powder;
                        let ambient = sky_ambient * exp(-dens * 0.4);
                        let step_trans = exp(-dens * step_dt * 1.5);
                        accum += trans * (direct + ambient) * (1.0 - step_trans);
                        trans *= step_trans;
                    }
                    t += step_dt;
                }

                let sky_bg = mix(vec3<f32>(0.65, 0.78, 0.95), vec3<f32>(0.12, 0.32, 0.75), clamp(ray_dir.y * 1.5 + 0.2, 0.0, 1.0));
                let sun_disk = pow(max(dot(ray_dir, sun_dir), 0.0), 512.0) * 8.0;
                var col = accum + trans * (sky_bg + vec3<f32>(1.0, 0.9, 0.7) * sun_disk);
                col = clamp(col / (col + vec3<f32>(1.0)), vec3<f32>(0.0), vec3<f32>(1.0));
                return vec4<f32>(col, 1.0);
            }
        `,
        magma_planck: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn planck_blackbody(temp_k: f32) -> vec3<f32> {
                let t = temp_k / 100.0;
                var r = 1.0;
                var g = clamp(99.47 * log(max(t, 1.0)) - 161.12, 0.0, 255.0) / 255.0;
                var b = clamp(138.51 * log(max(t - 10.0, 1.0)) - 305.04, 0.0, 255.0) / 255.0;
                return vec3<f32>(r, g, b);
            }

                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                var col = vec3<f32>(0.05, 0.02, 0.01);
                var t = 0.0;
                for (var i = 0; i < 64; i++) {
                    let p = ray_pos + ray_dir * t;
                    let wave = sin(p.x * 0.8 + u.time * 1.5) * cos(p.z * 0.8 + u.time) * 0.4;
                    let d = p.y - wave + 1.0;
                    if (d < 0.01) {
                        let temp_k = 1000.0 + sin(p.x * 2.0 + u.time * 2.0) * 400.0;
                        let glow = planck_blackbody(temp_k) * 2.0;
                        let crust = vec3<f32>(0.1, 0.08, 0.06);
                        let pattern = sin(p.x * 4.0) * sin(p.z * 4.0);
                        col = select(glow, crust, pattern > 0.3);

                    }
                    t += d * 0.9;
                    if (t > 30.0) { break; }

                return vec4<f32>(col, 1.0);

        `,
        crystal_cave: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {

                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                var col = vec3<f32>(0.02, 0.04, 0.08);
                var t = 0.0;
                for (var i = 0; i < 64; i++) {
                    let p = ray_pos + ray_dir * t;
                    let octa = (abs(p.x) + abs(p.y) + abs(p.z)) - 2.5;
                    if (octa < 0.01) {
                        let n = normalize(vec3<f32>(sign(p.x), sign(p.y), sign(p.z)));
                        let fresnel = pow(1.0 - max(dot(-ray_dir, n), 0.0), 3.0);
                        let crystal_tint = vec3<f32>(0.2, 0.8, 1.0);
                        col = mix(crystal_tint * 0.4, vec3<f32>(0.9, 0.95, 1.0), fresnel);

    };

    async function initWebGPU() {
        if (!navigator.gpu) {
            gpuNameEl.innerText = "WebGPU not supported (Fallback Mode)";
            gpuNameEl.style.color = "#f85149";
            return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            gpuNameEl.innerText = "No WebGPU Adapter found";
            return;
        }

        const device = await adapter.requestDevice();
        gpuNameEl.innerText = adapter.info?.device || adapter.info?.architecture || "Hardware GPU";
        gpuNameEl.style.color = "#7ee787";

        const context = canvas.getContext('webgpu');
        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({ device, format, alphaMode: 'premultiplied' });

        // Uniform Buffer
        const uniformBufferSize = 48; // 12 f32
        const uniformBuffer = device.createBuffer({
            size: uniformBufferSize,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        function createPipeline(shaderCode) {
            const module = device.createShaderModule({ code: shaderCode });
            return device.createRenderPipeline({
                layout: 'auto',
                vertex: { module, entryPoint: 'vs_main' },
                fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
                primitive: { topology: 'triangle-strip' },
            });
        }

        let currentPipeline = createPipeline(wgslShaders.black_hole);

        sceneSelect.addEventListener('change', (e) => {
            const sceneKey = e.target.value;
            currentPipeline = createPipeline(wgslShaders[sceneKey]);
            sceneTitle.innerText = sceneSelect.options[sceneSelect.selectedIndex].text;
        });

        // Interactive Orbit Camera
        let camDist = 12.0;
        let camRotX = 0.2;
        let camRotY = 0.5;
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            camRotY += dx * 0.005;
            camRotX = Math.max(-1.4, Math.min(1.4, camRotX + dy * 0.005));
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('wheel', (e) => {
            camDist = Math.max(3.0, Math.min(40.0, camDist + e.deltaY * 0.01));
            e.preventDefault();
        });

        let frameCount = 0;
        let lastTime = performance.now();
        let simTime = 0;

        function render(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            simTime += dt * (speedSlider.value / 100);

            // FPS Counter
            frameCount++;
            if (frameCount % 30 === 0) {
                const fps = (1 / dt).toFixed(0);
                fpsValEl.innerText = fps;
                frameTimeEl.innerText = (dt * 1000).toFixed(1);
            }

            // Resize canvas
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                resValEl.innerText = `${w}x${h}`;
            }

            const camX = camDist * Math.cos(camRotX) * Math.sin(camRotY);
            const camY = camDist * Math.sin(camRotX);
            const camZ = camDist * Math.cos(camRotX) * Math.cos(camRotY);
            const camDirX = -camX, camDirY = -camY, camDirZ = -camZ;

            const uniformData = new Float32Array([
                camX, camY, camZ, simTime,
                camDirX, camDirY, camDirZ, parseFloat(fovSlider.value),
                w, h, 0, 0
            ]);
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            const bindGroup = device.createBindGroup({
                layout: currentPipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
            });

            const commandEncoder = device.createCommandEncoder();
            const passEncoder = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });

            passEncoder.setPipeline(currentPipeline);
            passEncoder.setBindGroup(0, bindGroup);
            passEncoder.draw(4);
            passEncoder.end();

            device.queue.submit([commandEncoder.finish()]);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    }

    initWebGPU();
</script>
