<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloEngine — Live Offline WebGPU Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #sidebar {
            width: 340px;
            background: #161b22;
            border-left: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
            z-index: 10;
        }
        h2 { font-size: 1.2rem; color: #58a6ff; }
        .badge {
            display: inline-block;
            background: #238636;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-left: 8px;
        }
        label { font-size: 0.85rem; color: #8b949e; display: block; margin-bottom: 4px; }
        select, input[type="range"] {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .stats-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #7ee787;
        }
        .nav-links {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #30363d; color: #fff; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 18px;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        #overlay h1 { font-size: 1.1rem; color: #58a6ff; }
        #overlay p { font-size: 0.8rem; color: #8b949e; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="overlay">
        <h1 id="scene-title">Kerr Black Hole & Relativistic Spacetime</h1>
        <p>100% Offline Client-Side WebGPU Raymarching | Drag mouse to rotate</p>
    </div>
    <canvas id="webgpu-canvas"></canvas>
</div>

<div id="sidebar">
    <div>
        <h2>HoloEngine WebGPU <span class="badge">OFFLINE</span></h2>
        <p style="font-size: 0.8rem; color: #8b949e; margin-top: 4px;">Zero-Copy GPU In-Browser Shader Execution</p>
    </div>

    <div>
        <label for="scene-select">Physical Biome / Shader</label>
        <select id="scene-select">
            <option value="black_hole">🕳️ Kerr Black Hole (T-Dual Relativistic)</option>
            <option value="magma_planck">🔥 Volcano Magma Core (Planck Blackbody 800K-1500K)</option>
            <option value="ocean_waves">🌊 Ocean Hydrodynamics (Navier-Stokes)</option>
            <option value="desert_dunes">🏜️ Aeolian Desert Dunes (1-Lipschitz)</option>
            <option value="crystal_cave">💎 Crystal Cave (Fresnel SSR & IOR 1.54)</option>
            <option value="atmosphere">☁️ Atmospheric Clouds (Rayleigh-Mie)</option>
        </select>
    </div>

    <div>
        <label for="camera-fov">Field of View (FOV): <span id="fov-val">60°</span></label>
        <input type="range" id="camera-fov" min="30" max="100" value="60">
    </div>

    <div>
        <label for="time-speed">Simulation Speed: <span id="speed-val">1.0x</span></label>
        <input type="range" id="time-speed" min="0" max="300" value="100">
    </div>

    <div class="stats-card">
        <div>GPU Backend: <span id="gpu-name">Detecting...</span></div>
        <div>FPS: <span id="fps-val">--</span> (<span id="frame-time">--</span> ms)</div>
        <div>Resolution: <span id="res-val">--</span></div>
        <div style="margin-top: 8px; border-top: 1px dashed #30363d; padding-top: 6px; color: #58a6ff;">
            TDA Invariant: <span id="tda-status">Active</span>
        </div>
    </div>

    <div class="nav-links">
        <a href="index.html" class="btn">Remote Node</a>
        <a href="gallery.html" class="btn">4x5 Gallery</a>
    </div>
</div>

<script type="module">
    const canvas = document.getElementById('webgpu-canvas');
    const sceneSelect = document.getElementById('scene-select');
    const sceneTitle = document.getElementById('scene-title');
    const fovSlider = document.getElementById('camera-fov');
    const fovVal = document.getElementById('fov-val');
    const speedSlider = document.getElementById('time-speed');
    const speedVal = document.getElementById('speed-val');
    const gpuNameEl = document.getElementById('gpu-name');
    const fpsValEl = document.getElementById('fps-val');
    const frameTimeEl = document.getElementById('frame-time');
    const resValEl = document.getElementById('res-val');

    fovSlider.addEventListener('input', (e) => fovVal.innerText = `${e.target.value}°`);
    speedSlider.addEventListener('input', (e) => speedVal.innerText = `${(e.target.value/100).toFixed(1)}x`);

    // WGSL Shaders
    const wgslShaders = {
        black_hole: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn hash33(p: vec3<f32>) -> vec3<f32> {
                var p3 = fract(p * vec3<f32>(0.1031, 0.1030, 0.0973));
                p3 += dot(p3, p3.yxz + 33.33);
                return fract((p3.xxy + p3.yxx) * p3.zyx);
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                var ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                let r_horizon = 1.0;
                let r_isco = 3.0;
                var col = vec3<f32>(0.0);
                var min_dist = 1000.0;

                for (var i = 0; i < 90; i++) {
                    let r = length(ray_pos);
                    min_dist = min(min_dist, r);
                    if (r < r_horizon) { col = vec3<f32>(0.0); break; }
                    if (r > 35.0) {
                        let star_p = floor(ray_dir * 180.0);
                        let star_h = hash33(star_p);
                        if (star_h.x > 0.985) { col += vec3<f32>(star_h.y * 1.5); }
                        break;
                    }
                    if (abs(ray_pos.y) < 0.18 && r > r_isco && r < 12.0) {
                        let disk_lum = exp(-(r - r_isco) * 0.45) * 1.8;
                        let phi = atan2(ray_pos.z, ray_pos.x) - u.time * (2.5 / sqrt(r));
                        let spiral = sin(phi * 3.0 + r * 1.2) * 0.5 + 0.5;
                        let doppler = clamp(1.0 - ray_dir.x * 0.55, 0.4, 2.2);
                        let fire = vec3<f32>(1.0, 0.55 * doppler, 0.15) * disk_lum * (0.6 + 0.4 * spiral);
                        col += fire * 0.25;
                    }
                    let r_eff = max(r, 0.5 / max(r, 0.01));
                    let g_accel = -1.5 * ray_pos / (r_eff * r_eff * r_eff);
                    ray_dir = normalize(ray_dir + g_accel * 0.16);
                    ray_pos += ray_dir * 0.16;
                }
                return vec4<f32>(col, 1.0);
            }
        `,
        ocean_waves: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));

                if (ray_dir.y >= 0.0) {
                    let sky = mix(vec3<f32>(0.9, 0.45, 0.2), vec3<f32>(0.05, 0.1, 0.3), ray_dir.y);
                    let sun = pow(max(dot(ray_dir, normalize(vec3<f32>(0.0, 0.15, -1.0))), 0.0), 32.0);
                    return vec4<f32>(sky + vec3<f32>(1.0, 0.8, 0.3) * sun, 1.0);
                }
                let t = -u.cam_pos.y / ray_dir.y;
                let hit = u.cam_pos + ray_dir * t;
                let wave = sin(hit.x * 0.4 + u.time * 2.0) * cos(hit.z * 0.4 + u.time * 1.5) * 0.5;
                let ocean_col = mix(vec3<f32>(0.01, 0.12, 0.25), vec3<f32>(0.02, 0.35, 0.45), wave + 0.5);
                let sun_glint = pow(max(dot(reflect(ray_dir, vec3<f32>(0.0, 1.0, 0.0)), normalize(vec3<f32>(0.0, 0.15, -1.0))), 0.0), 64.0);
                return vec4<f32>(ocean_col + vec3<f32>(1.0, 0.85, 0.5) * sun_glint * 1.5, 1.0);
            }
        `,
        desert_dunes: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));

                var p = u.cam_pos;
                var col = vec3<f32>(0.15, 0.4, 0.8);
                for (var i = 0; i < 70; i++) {
                    let h = sin(p.x * 0.15 + sin(p.z * 0.1)) * 3.5 + sin(p.z * 0.25 - p.x * 0.08) * 1.5;
                    let d = p.y - h;
                    if (d < 0.02) {
                        let sand = vec3<f32>(0.92, 0.65, 0.32);
                        let shadow = clamp((p.y + 4.0) / 8.0, 0.2, 1.0);
                        col = sand * shadow;
                        break;
                    }
                    p += ray_dir * max(d * 0.6, 0.1);
                    if (length(p) > 100.0) { break; }
                }
                return vec4<f32>(col, 1.0);
            }
        `,
        atmosphere: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));

                let sky_grad = mix(vec3<f32>(0.7, 0.85, 1.0), vec3<f32>(0.1, 0.35, 0.8), max(ray_dir.y, 0.0));
                let cloud = sin(ray_dir.x * 6.0 + u.time * 0.2) * cos(ray_dir.z * 6.0 + u.time * 0.15);
                let cloud_val = smoothstep(0.2, 0.8, cloud);
                let col = mix(sky_grad, vec3<f32>(1.0, 1.0, 1.0), cloud_val * 0.7);
                return vec4<f32>(col, 1.0);
            }
        `,
        magma_planck: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            fn planck_blackbody(temp_k: f32) -> vec3<f32> {
                let t = temp_k / 100.0;
                var r = 1.0;
                var g = clamp(99.47 * log(max(t, 1.0)) - 161.12, 0.0, 255.0) / 255.0;
                var b = clamp(138.51 * log(max(t - 10.0, 1.0)) - 305.04, 0.0, 255.0) / 255.0;
                return vec3<f32>(r, g, b);
            }

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                var col = vec3<f32>(0.05, 0.02, 0.01);
                var t = 0.0;
                for (var i = 0; i < 64; i++) {
                    let p = ray_pos + ray_dir * t;
                    let wave = sin(p.x * 0.8 + u.time * 1.5) * cos(p.z * 0.8 + u.time) * 0.4;
                    let d = p.y - wave + 1.0;
                    if (d < 0.01) {
                        let temp_k = 1000.0 + sin(p.x * 2.0 + u.time * 2.0) * 400.0;
                        let glow = planck_blackbody(temp_k) * 2.0;
                        let crust = vec3<f32>(0.1, 0.08, 0.06);
                        let pattern = sin(p.x * 4.0) * sin(p.z * 4.0);
                        col = select(glow, crust, pattern > 0.3);
                        break;
                    }
                    t += d * 0.9;
                    if (t > 30.0) { break; }
                }
                return vec4<f32>(col, 1.0);
            }
        `,
        crystal_cave: `
            struct Uniforms {
                cam_pos: vec3<f32>,
                time: f32,
                cam_dir: vec3<f32>,
                fov: f32,
                resolution: vec2<f32>,
                _pad: vec2<f32>,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;

            @vertex
            fn vs_main(@builtin(vertex_index) vid: u32) -> @builtin(position) vec4<f32> {
                var pos = array<vec2<f32>, 4>(
                    vec2<f32>(-1.0, -1.0),
                    vec2<f32>( 1.0, -1.0),
                    vec2<f32>(-1.0,  1.0),
                    vec2<f32>( 1.0,  1.0)
                );
                return vec4<f32>(pos[vid], 0.0, 1.0);
            }

            @fragment
            fn fs_main(@builtin(position) frag_pos: vec4<f32>) -> @location(0) vec4<f32> {
                let uv = (frag_pos.xy - 0.5 * u.resolution) / u.resolution.y;
                let forward = normalize(u.cam_dir);
                let right = normalize(cross(forward, vec3<f32>(0.0, 1.0, 0.0)));
                let up = cross(right, forward);
                let fov_rad = u.fov * 0.0174533;
                let ray_dir = normalize(forward + (uv.x * right + uv.y * up) * tan(fov_rad * 0.5));
                var ray_pos = u.cam_pos;

                var col = vec3<f32>(0.02, 0.04, 0.08);
                var t = 0.0;
                for (var i = 0; i < 64; i++) {
                    let p = ray_pos + ray_dir * t;
                    let octa = (abs(p.x) + abs(p.y) + abs(p.z)) - 2.5;
                    if (octa < 0.01) {
                        let n = normalize(vec3<f32>(sign(p.x), sign(p.y), sign(p.z)));
                        let fresnel = pow(1.0 - max(dot(-ray_dir, n), 0.0), 3.0);
                        let crystal_tint = vec3<f32>(0.2, 0.8, 1.0);
                        col = mix(crystal_tint * 0.4, vec3<f32>(0.9, 0.95, 1.0), fresnel);
                        break;
                    }
                    t += octa * 0.85;
                    if (t > 25.0) { break; }
                }
                return vec4<f32>(col, 1.0);
            }
        `
    };

    async function initWebGPU() {
        if (!navigator.gpu) {
            gpuNameEl.innerText = "WebGPU not supported (Fallback Mode)";
            gpuNameEl.style.color = "#f85149";
            return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            gpuNameEl.innerText = "No WebGPU Adapter found";
            return;
        }

        const device = await adapter.requestDevice();
        gpuNameEl.innerText = adapter.info?.device || adapter.info?.architecture || "Hardware GPU";
        gpuNameEl.style.color = "#7ee787";

        const context = canvas.getContext('webgpu');
        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({ device, format, alphaMode: 'premultiplied' });

        // Uniform Buffer
        const uniformBufferSize = 48; // 12 f32
        const uniformBuffer = device.createBuffer({
            size: uniformBufferSize,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        function createPipeline(shaderCode) {
            const module = device.createShaderModule({ code: shaderCode });
            return device.createRenderPipeline({
                layout: 'auto',
                vertex: { module, entryPoint: 'vs_main' },
                fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
                primitive: { topology: 'triangle-strip' },
            });
        }

        let currentPipeline = createPipeline(wgslShaders.black_hole);

        sceneSelect.addEventListener('change', (e) => {
            const sceneKey = e.target.value;
            currentPipeline = createPipeline(wgslShaders[sceneKey]);
            sceneTitle.innerText = sceneSelect.options[sceneSelect.selectedIndex].text;
        });

        // Interactive Orbit Camera
        let camDist = 12.0;
        let camRotX = 0.2;
        let camRotY = 0.5;
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            camRotY += dx * 0.005;
            camRotX = Math.max(-1.4, Math.min(1.4, camRotX + dy * 0.005));
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('wheel', (e) => {
            camDist = Math.max(3.0, Math.min(40.0, camDist + e.deltaY * 0.01));
            e.preventDefault();
        });

        let frameCount = 0;
        let lastTime = performance.now();
        let simTime = 0;

        function render(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            simTime += dt * (speedSlider.value / 100);

            // FPS Counter
            frameCount++;
            if (frameCount % 30 === 0) {
                const fps = (1 / dt).toFixed(0);
                fpsValEl.innerText = fps;
                frameTimeEl.innerText = (dt * 1000).toFixed(1);
            }

            // Resize canvas
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                resValEl.innerText = `${w}x${h}`;
            }

            const camX = camDist * Math.cos(camRotX) * Math.sin(camRotY);
            const camY = camDist * Math.sin(camRotX);
            const camZ = camDist * Math.cos(camRotX) * Math.cos(camRotY);
            const camDirX = -camX, camDirY = -camY, camDirZ = -camZ;

            const uniformData = new Float32Array([
                camX, camY, camZ, simTime,
                camDirX, camDirY, camDirZ, parseFloat(fovSlider.value),
                w, h, 0, 0
            ]);
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            const bindGroup = device.createBindGroup({
                layout: currentPipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
            });

            const commandEncoder = device.createCommandEncoder();
            const passEncoder = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });

            passEncoder.setPipeline(currentPipeline);
            passEncoder.setBindGroup(0, bindGroup);
            passEncoder.draw(4);
            passEncoder.end();

            device.queue.submit([commandEncoder.finish()]);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    }

    initWebGPU();
</script>
